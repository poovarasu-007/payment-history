<style>
  /* ---------------------------------------------------------------- Layout */
  html { scroll-behavior: smooth; }
  .view { animation: fade .18s ease-in; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* --------------------------------------------------------------- Sidebar */
  .nav-btn {
    display: flex; align-items: center; gap: .65rem; width: 100%;
    padding: .6rem .85rem; border-radius: .6rem; font-size: .9rem;
    color: #cbd5e1; transition: background .15s, color .15s; text-align: left;
  }
  .nav-btn:hover { background: rgba(255,255,255,.08); color: #fff; }
  .nav-btn.is-active { background: #2563eb; color: #fff; font-weight: 600; }

  /* ----------------------------------------------------------------- Cards */
  .card {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 1rem;
    padding: 1.1rem 1.15rem; box-shadow: 0 1px 2px rgba(15,23,42,.04);
  }
  .dark .card { background: #1e293b; border-color: #334155; box-shadow: none; }
  .card-title { font-weight: 600; font-size: .95rem; margin-bottom: .65rem; }

  .stat-card { display: flex; flex-direction: column; gap: .2rem; }
  .stat-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: #64748b; }
  .dark .stat-label { color: #94a3b8; }
  .stat-value { font-size: 1.5rem; font-weight: 700; line-height: 1.2; word-break: break-word; }
  .stat-sub { font-size: .75rem; color: #64748b; }
  .dark .stat-sub { color: #94a3b8; }

  .text-income { color: #16a34a; }
  .text-expense { color: #dc2626; }
  .text-info { color: #2563eb; }

  /* --------------------------------------------------------------- Buttons */
  .btn { display: inline-flex; align-items: center; gap: .35rem; padding: .5rem .9rem;
         border-radius: .6rem; font-size: .85rem; font-weight: 500; transition: .15s; cursor: pointer;
         border: 1px solid transparent; }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-ghost { background: transparent; border-color: #cbd5e1; color: inherit; }
  .btn-ghost:hover { background: #f1f5f9; }
  .dark .btn-ghost { border-color: #475569; }
  .dark .btn-ghost:hover { background: #334155; }
  .btn-danger { background: #dc2626; color: #fff; }
  .btn-danger:hover { background: #b91c1c; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ------------------------------------------------------- Segmented toggle */
  .seg { display: inline-flex; background: #f1f5f9; border-radius: .55rem; padding: 2px; }
  .dark .seg { background: #0f172a; }
  .seg-btn { padding: .3rem .7rem; font-size: .75rem; border-radius: .45rem; color: #475569; }
  .dark .seg-btn { color: #94a3b8; }
  .seg-btn.is-active { background: #fff; color: #1e293b; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .dark .seg-btn.is-active { background: #334155; color: #fff; }

  /* -------------------------------------------------------- Range pills */
  .range-pill { padding: .3rem .75rem; font-size: .78rem; border-radius: 999px;
                border: 1px solid #cbd5e1; color: #475569; cursor: pointer; background: transparent; }
  .dark .range-pill { border-color: #475569; color: #cbd5e1; }
  .range-pill.is-active { background: #2563eb; border-color: #2563eb; color: #fff; font-weight: 600; }
  .dark .range-pill.is-active { background: #2563eb; border-color: #2563eb; color: #fff; }

  /* ---------------------------------------------------------------- Fields */
  .field { width: 100%; padding: .5rem .7rem; font-size: .85rem; border-radius: .6rem;
           border: 1px solid #cbd5e1; background: #fff; color: inherit; }
  .dark .field { background: #0f172a; border-color: #475569; color: #e2e8f0; }
  .field:focus { outline: 2px solid #2563eb33; border-color: #2563eb; }
  .field-label { display: block; font-size: .72rem; font-weight: 600; text-transform: uppercase;
                 letter-spacing: .05em; color: #64748b; margin-bottom: .25rem; }
  .dark .field-label { color: #94a3b8; }

  /* ---------------------------------------------------------------- Charts */
  .chart-box { position: relative; width: 100%; height: 300px; }
  .chart-box.chart-tall { height: 340px; }
  .chart-box .chart-empty { position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; gap: .3rem;
      color: #94a3b8; font-size: .85rem; border: 1px dashed #cbd5e1; border-radius: .75rem; }
  .dark .chart-box .chart-empty { border-color: #475569; }

  /* ---------------------------------------------------------------- Tables */
  .data-table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  .data-table th { text-align: left; padding: .65rem .75rem; background: #f8fafc; color: #475569;
                   font-weight: 600; white-space: nowrap; border-bottom: 1px solid #e2e8f0; font-size: .74rem;
                   text-transform: uppercase; letter-spacing: .04em; }
  .data-table th[data-sort] { cursor: pointer; user-select: none; }
  .data-table th[data-sort]:hover { color: #2563eb; }
  .dark .data-table th { background: #0f172a; color: #94a3b8; border-color: #334155; }
  .data-table td { padding: .6rem .75rem; border-bottom: 1px solid #f1f5f9; white-space: nowrap; }
  .dark .data-table td { border-color: #334155; }
  .data-table tbody tr:hover { background: #f8fafc; }
  .dark .data-table tbody tr:hover { background: #0f172a; }

  .badge { display: inline-flex; align-items: center; padding: .15rem .55rem; border-radius: 999px;
           font-size: .7rem; font-weight: 600; white-space: nowrap; }
  .badge-green  { background: #dcfce7; color: #15803d; }
  .badge-red    { background: #fee2e2; color: #b91c1c; }
  .badge-amber  { background: #fef3c7; color: #b45309; }
  .badge-orange { background: #ffedd5; color: #c2410c; }
  .badge-gray   { background: #e2e8f0; color: #475569; }
  .badge-blue   { background: #dbeafe; color: #1d4ed8; }
  .dark .badge-green  { background: #14532d; color: #bbf7d0; }
  .dark .badge-red    { background: #7f1d1d; color: #fecaca; }
  .dark .badge-amber  { background: #78350f; color: #fde68a; }
  .dark .badge-orange { background: #7c2d12; color: #fed7aa; }
  .dark .badge-gray   { background: #334155; color: #cbd5e1; }
  .dark .badge-blue   { background: #1e3a8a; color: #bfdbfe; }

  .amount-in  { color: #16a34a; font-weight: 600; }
  .amount-out { color: #dc2626; font-weight: 600; }

  /* --------------------------------------------------------------- Dropzone */
  .dropzone { border: 2px dashed #cbd5e1; border-radius: .9rem; padding: 1.6rem; text-align: center;
              transition: .15s; cursor: pointer; }
  .dark .dropzone { border-color: #475569; }
  .dropzone.is-over { border-color: #2563eb; background: #eff6ff44; }

  /* ----------------------------------------------------------------- Toast */
  #toast.ok   { background: #15803d; color: #fff; }
  #toast.err  { background: #b91c1c; color: #fff; }
  #toast.info { background: #1e293b; color: #fff; }

  /* ----------------------------------------------------------- Print styles */
  .print-only { display: none; }
  @media print {
    body * { visibility: hidden !important; }
    #print-area, #print-area * { visibility: visible !important; }
    #print-area { display: block !important; position: absolute; inset: 0; padding: 24px; background: #fff; color: #000; }
    #print-area table { width: 100%; border-collapse: collapse; font-size: 12px; }
    #print-area th, #print-area td { border: 1px solid #999; padding: 4px 6px; text-align: left; }
    #print-area h1 { font-size: 20px; margin-bottom: 4px; }
    #print-area h2 { font-size: 15px; margin: 16px 0 6px; }
  }

  /* -------------------------------------------------------- Scrollbars */
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
  .dark ::-webkit-scrollbar-thumb { background: #475569; }
</style>
